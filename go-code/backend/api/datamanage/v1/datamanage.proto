syntax = "proto3";

package api.datamanage.v1;

import "google/api/annotations.proto";

option go_package = "gitee.com/kangdan0404/backend-of-knowledge-base/api/datamanage/v1;v1";

// The DataManage service definition.
service DataManage {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply) {
    option (google.api.http) = {
      get: "/dataset/{name}"
    };
  }
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings
message HelloReply {
  string message = 1;
}
