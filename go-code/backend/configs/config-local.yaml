server:
  http:
    addr: 0.0.0.0:8001
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
data:
  database:
    url: root:root@tcp(localhost:13306)/knowledge?charset=utf8mb4
    maxIdle: 10
    tpl: ./configs/tpl
    init_db_file: ./configs/db/init.sql
  redis:
    addr: 127.0.0.1:16379  # Redis 的本地地址和端口
    password:     # Redis 密码，如果没有设置密码可以留空
    db: 6                 # 使用的 Redis 数据库编号
    read_timeout: 0.2s    # 读取超时时间
    write_timeout: 0.2s   # 写入超时时间
  fileCache:
    tempRootDir: ../runtime-data/files
    prefix: /data
