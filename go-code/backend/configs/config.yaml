server:
  http:
    addr: 0.0.0.0:8000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
data:
  database:
    url: root:root@tcp(mysql:3306)/knowledge?charset=utf8mb4
    #    url: root:Teco@135@tcp(10.8.20.200:30383)/dataset?charset=utf8mb4
    maxIdle: 10
    tpl: /data/conf/tpl
    init_db_file: /data/conf/db/init.sql

    #  redis:
    #    addr: 10.8.20.100:31379
    #    password: tecoai123
    #    db: 6
  redis:
    addr: redis:6379  # Redis 的本地地址和端口
    password:     # Redis 密码，如果没有设置密码可以留空
    db: 6                 # 使用的 Redis 数据库编号
    read_timeout: 0.2s    # 读取超时时间
    write_timeout: 0.2s   # 写入超时时间
  fileCache:
    tempRootDir: /data/files
    prefix: /data
