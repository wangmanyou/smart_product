syntax = "proto3";
package kratos.api;

option go_package = "data-center/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message FileCache{
    string prefix = 3;
    string tempRootDir = 4;
  }
  message Database {
    string url = 1;
    int32 max_idle = 2;
    string tpl = 3;
    string init_db_file = 4;
  }
  message Redis {
    string addr = 1;
    string password = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    int32 db = 5;
  }
  Database database = 1;
  Redis redis = 2;
  FileCache fileCache = 3;
}
