                - name: userAccount
                  in: query
                  description: 用户账号，唯一不可修改
                  schema:
                    type: string
                - name: userPassword
                  in: query
                  description: 用户密码
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.usermanage.v1.LoginReply'
    /v1/data/user/password/random:
        get:
            tags:
                - UserManage
            description: 生成随机密码
            operationId: UserManage_RandomPassword
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.usermanage.v1.RandomPasswordReply'
    /v1/data/user/password/reset:
        post:
            tags:
                - UserManage
            description: 重置用户密码
            operationId: UserManage_ResetUserPassword
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.usermanage.v1.ResetUserPasswordRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content: {}
