services:
  mysql:
    image: mysql:8.0
    container_name: smart-product-parallel-mysql
    restart: unless-stopped
    environment:
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: knowledge
    volumes:
      - ../deploy-data/mysql:/var/lib/mysql
      - ./deploy/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "23306:3306"
    command: mysqld
    networks:
      - smart-product-parallel-net

  redis:
    image: redis:6.2
    container_name: smart-product-parallel-redis
    restart: unless-stopped
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/redis/conf/redis.conf:ro
      - ../deploy-data/redis:/data
    command: ["redis-server", "/usr/local/redis/conf/redis.conf", "--appendonly", "yes"]
    ports:
      - "26379:6379"
    networks:
      - smart-product-parallel-net

  spring-server:
    image: m.daocloud.io/docker.io/library/eclipse-temurin:21-jre
    container_name: smart-product-parallel-spring
    restart: unless-stopped
    working_dir: /app
    mem_limit: 1024m
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m -XX:MaxMetaspaceSize=192m
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/knowledge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 6
      SPRING_PROFILES_ACTIVE: prod
      APP_UPLOAD_DIR: /app/uploads
      SERVER_PORT: 8001
    volumes:
      - ./backend-app/app.jar:/app/app.jar:ro
      - ../deploy-data/files:/app/uploads
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "18001:8001"
    depends_on:
      - mysql
      - redis
    networks:
      - smart-product-parallel-net

  web:
    image: m.daocloud.io/docker.io/library/nginx:1.26-alpine3.19
    container_name: smart-product-parallel-web
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./frontend-dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18000:80"
    depends_on:
      - spring-server
    networks:
      - smart-product-parallel-net

networks:
  smart-product-parallel-net:
    name: smart-product-parallel-net
