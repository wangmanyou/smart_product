name: smart-product-next

services:
  mysql:
    image: mysql:8.0
    container_name: smart-product-next-mysql
    restart: unless-stopped
    environment:
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: ${NEXT_MYSQL_ROOT_PASSWORD:?NEXT_MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: knowledge
    volumes:
      - ${NEXT_SERVER_DATA_ROOT:-../deploy-data-next}/mysql:/var/lib/mysql
      - ./deploy/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "127.0.0.1:33306:3306"
    command: mysqld
    networks:
      - smart-product-next-net

  redis:
    image: redis:6.2
    container_name: smart-product-next-redis
    restart: unless-stopped
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/redis/conf/redis.conf:ro
      - ${NEXT_SERVER_DATA_ROOT:-../deploy-data-next}/redis:/data
    command: ["redis-server", "/usr/local/redis/conf/redis.conf", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:36379:6379"
    networks:
      - smart-product-next-net

  spring-server:
    image: m.daocloud.io/docker.io/library/eclipse-temurin:21-jre
    container_name: smart-product-next-spring
    restart: unless-stopped
    working_dir: /app
    mem_limit: 1024m
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m -XX:MaxMetaspaceSize=192m
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/knowledge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${NEXT_MYSQL_ROOT_PASSWORD:?NEXT_MYSQL_ROOT_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 6
      SPRING_PROFILES_ACTIVE: prod
      APP_UPLOAD_DIR: /app/uploads
      APP_JWT_SECRET_FILE: /run/secrets/next-jwt-secret
      APP_JWT_ISSUER: ${NEXT_JWT_ISSUER:-smart-product-next}
      APP_JWT_AUDIENCE: ${NEXT_JWT_AUDIENCE:-smart-product-next-web}
      APP_JWT_TTL_SECONDS: ${NEXT_JWT_TTL_SECONDS:-86400}
      SERVER_PORT: 8001
    volumes:
      - ./backend-app/app.jar:/app/app.jar:ro
      - ${NEXT_SERVER_DATA_ROOT:-../deploy-data-next}/files:/app/uploads
    secrets:
      - source: next-jwt-secret
        target: next-jwt-secret
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "127.0.0.1:28001:8001"
    depends_on:
      - mysql
      - redis
    networks:
      - smart-product-next-net

  web:
    image: m.daocloud.io/docker.io/library/nginx:1.26-alpine3.19
    container_name: smart-product-next-web
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./frontend-dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "28000:80"
    depends_on:
      - spring-server
    networks:
      - smart-product-next-net

secrets:
  next-jwt-secret:
    file: ${NEXT_JWT_SECRET_FILE:?NEXT_JWT_SECRET_FILE is required}

networks:
  smart-product-next-net:
    name: smart-product-next-net
