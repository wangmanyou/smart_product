server:
  port: 8001

app:
  upload-dir: ${APP_UPLOAD_DIR:${user.dir}/../../spring-runtime-data/dev/files}
  security:
    jwt:
      # Local development uses a generated, Git-ignored file by default. The prod profile disables this fallback.
      # APP_JWT_SECRET_FILE can override the path; APP_JWT_SECRET is intended only as a temporary local fallback.
      # Both values must contain Base64 that decodes to at least 32 bytes.
      secret: ${APP_JWT_SECRET:}
      secret-file: ${APP_JWT_SECRET_FILE:${user.dir}/../../spring-runtime-data/dev/secrets/jwt-secret}
      issuer: ${APP_JWT_ISSUER:smart-product-spring}
      audience: ${APP_JWT_AUDIENCE:smart-product-web}
      ttl-seconds: ${APP_JWT_TTL_SECONDS:86400}

spring:
  application:
    name: knowledge-hub-backend-spring
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/knowledge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      database: 6
      timeout: 200ms

logging:
  level:
    com.smartproduct: INFO

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
