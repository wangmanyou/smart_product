name: smart-product-spring-dev

services:
  mysql:
    image: mysql:8.0
    container_name: smart-product-spring-dev-mysql
    restart: unless-stopped
    environment:
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: knowledge
    volumes:
      - ../spring-runtime-data/dev/mysql:/var/lib/mysql
      - ./deploy/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "13306:3306"
    command: mysqld
    networks:
      - smart-product-spring-dev-net

  redis:
    image: redis:6.2
    container_name: smart-product-spring-dev-redis
    restart: unless-stopped
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/redis/conf/redis.conf:ro
      - ../spring-runtime-data/dev/redis:/data
    command: ["redis-server", "/usr/local/redis/conf/redis.conf", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    networks:
      - smart-product-spring-dev-net

networks:
  smart-product-spring-dev-net:
    name: smart-product-spring-dev-net
