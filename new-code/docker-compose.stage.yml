services:
  mysql:
    image: mysql:8.0
    container_name: smart-product-stage-mysql
    restart: unless-stopped
    environment:
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: knowledge
    volumes:
      - ../stage-data/mysql:/var/lib/mysql
    ports:
      - "23306:3306"
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - smart-product-stage-net

  redis:
    image: redis:6.2
    container_name: smart-product-stage-redis
    restart: unless-stopped
    volumes:
      - ../stage-data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "26379:6379"
    networks:
      - smart-product-stage-net

  spring-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smart-product-spring:stage
    container_name: smart-product-stage-spring
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/knowledge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 6
      SPRING_PROFILES_ACTIVE: prod
      APP_UPLOAD_DIR: /app/uploads
      SERVER_PORT: 8001
    volumes:
      - ../stage-data/files:/app/uploads
    ports:
      - "18001:8001"
    depends_on:
      - mysql
      - redis
    networks:
      - smart-product-stage-net

  web:
    image: m.daocloud.io/docker.io/library/nginx:1.26-alpine3.19
    container_name: smart-product-stage-web
    restart: unless-stopped
    volumes:
      - ./frontend-app/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18000:80"
    depends_on:
      - spring-server
    networks:
      - smart-product-stage-net

networks:
  smart-product-stage-net:
    name: smart-product-stage-net
