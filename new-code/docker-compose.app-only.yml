services:
  spring-server:
    image: m.daocloud.io/docker.io/library/eclipse-temurin:21-jre
    container_name: smart-product-app-spring
    restart: unless-stopped
    working_dir: /app
    mem_limit: 768m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -XX:MaxMetaspaceSize=160m
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:13306/knowledge_new?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: 16379
      SPRING_DATA_REDIS_DATABASE: 6
      SPRING_PROFILES_ACTIVE: prod
      APP_UPLOAD_DIR: /app/uploads
      SERVER_PORT: 8001
    volumes:
      - ./backend-app/app.jar:/app/app.jar:ro
      - ../deploy-data/files:/app/uploads
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "18001:8001"
    networks:
      - smart-product-app-net

  web:
    image: m.daocloud.io/docker.io/library/nginx:1.26-alpine3.19
    container_name: smart-product-app-web
    restart: unless-stopped
    mem_limit: 96m
    volumes:
      - ./frontend-dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18000:80"
    depends_on:
      - spring-server
    networks:
      - smart-product-app-net

networks:
  smart-product-app-net:
    name: smart-product-app-net
