services:
  mysql:
    image: mysql:8.0
    container_name: smart-product-local-mysql
    restart: unless-stopped
    environment:
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: knowledge
    volumes:
      - ./data-mannagement/data-mannagement/deploy/data/mysql/lib:/var/lib/mysql
      - ./data-mannagement/data-mannagement/deploy/my.conf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "13306:3306"
    command: mysqld
    networks:
      - smart-product-local-net

  redis:
    image: redis:6.2
    container_name: smart-product-local-redis
    restart: unless-stopped
    volumes:
      - ./data-mannagement/data-mannagement/deploy/redis.conf:/usr/local/redis/conf/redis.conf:ro
      - ./data-mannagement/data-mannagement/deploy/data/redis/db:/data
    command: ["redis-server", "/usr/local/redis/conf/redis.conf", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    networks:
      - smart-product-local-net

  spring-server:
    build:
      context: ./knowledge-hub-backend-spring
      dockerfile: Dockerfile
    image: smart-product-local-spring:v1.0
    container_name: smart-product-local-spring
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/knowledge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 6
      SERVER_PORT: 8001
    volumes:
      - ./testdata:/app/target/uploads
    depends_on:
      - mysql
      - redis
    networks:
      - smart-product-local-net

  web:
    build:
      context: ./knowledge-hub-modern-fe
      dockerfile: Dockerfile.local
    image: smart-product-local-web:v1.0
    container_name: smart-product-local-web
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./testdata:/data:ro
    depends_on:
      - spring-server
    ports:
      - "8000:80"
    networks:
      - smart-product-local-net

networks:
  smart-product-local-net:
    name: smart-product-local-net
